workflows:
  android-debug:
    name: AKIRA ESP Android debug
    max_build_duration: 30
    instance_type: linux
    environment:
      vars:
        PACKAGE_NAME: "com.akira.esp"
    scripts:
      - name: Build debug APK
        script: |
          gradle --version
          gradle :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
